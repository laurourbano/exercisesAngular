version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/contadorAngular"
      - "/interacao-entre-componentes"
      - "/reactiveForms"
      - "/templateDriven"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      todas:
        patterns: ["*"]
        update-types: ["minor", "patch"]
